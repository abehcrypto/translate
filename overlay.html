<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ABÊTALK OBS Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100vh;
        }

        #subtitle-box {
            background: rgba(0, 0, 0, 0.75);
            border-left: 5px solid #00f2fe;
            padding: 15px 25px;
            margin-bottom: 40px;
            border-radius: 8px;
            max-width: 80%;
            text-align: center;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
            transition: opacity 0.5s ease;
            opacity: 0;
        }

        .show {
            opacity: 1 !important;
        }

        .pt-text {
            color: #ffffff;
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 4px;
            text-shadow: 1px 1px 2px black;
        }

        .en-text {
            color: #00f2fe;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>

    <div id="subtitle-box">
        <div id="pt" class="pt-text"></div>
        <div id="en" class="en-text"></div>
    </div>

    <script>
        const box = document.getElementById('subtitle-box');
        const ptElem = document.getElementById('pt');
        const enElem = document.getElementById('en');
        let hideTimeout;

        function connect() {
            const ws = new WebSocket("ws://localhost:8000/ws");

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                
                ptElem.innerText = data.texto_pt;
                enElem.innerText = data.texto_en;
                
                box.classList.add('show');

                clearTimeout(hideTimeout);
                hideTimeout = setTimeout(() => {
                    box.classList.remove('show');
                }, 6000);
            };

            ws.onclose = function() {
                setTimeout(connect, 2000);
            };
        }

        connect();
    </script>
</body>
</html>
